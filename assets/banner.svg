<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Ashish Ojha — Finance × Engineering">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1122"/><stop offset="1" stop-color="#111c38"/></linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.6"><stop offset="0" stop-color="#4a68ba" stop-opacity=".35"/><stop offset="1" stop-color="#4a68ba" stop-opacity="0"/></radialGradient>
    <linearGradient id="area" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#c9a96a" stop-opacity=".22"/><stop offset="1" stop-color="#c9a96a" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#c9a96a" stroke-opacity=".06"/></pattern>
    <style>
      .line{fill:none;stroke:#c9a96a;stroke-width:2;stroke-dasharray:700;stroke-dashoffset:700;animation:d 2.4s .3s ease-out forwards}
      @keyframes d{to{stroke-dashoffset:0}}
      @media (prefers-reduced-motion:reduce){.line{animation:none;stroke-dashoffset:0}}
    </style>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="18" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="1199" height="299" rx="18" fill="none" stroke="#c9a96a" stroke-opacity=".25"/>
  <text x="64" y="78" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="14" letter-spacing="3.5" fill="#c9a96a">BENGALURU · FINTECH · CREDIT · QUANT TOOLING</text>
  <text x="62" y="158" font-family="Georgia,'Times New Roman',serif" font-size="64" fill="#f3eee3">Ashish Ojha</text>
  <text x="64" y="210" font-family="Georgia,'Times New Roman',serif" font-size="30" fill="#c9c4b8">Finance <tspan fill="#c9a96a" font-style="italic">×</tspan> Engineering</text>
  <text x="64" y="252" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8c93a8">Ex-Goldman Sachs RFP Analyst · Credit consultant · Equity research · Python &amp; web tools</text>
  <g transform="translate(780,70)">
    <path d="M0,150 L40,140 L80,146 L120,120 L160,126 L200,96 L240,104 L280,70 L320,78 L360,36 L360,170 L0,170 Z" fill="url(#area)"/>
    <path class="line" d="M0,150 L40,140 L80,146 L120,120 L160,126 L200,96 L240,104 L280,70 L320,78 L360,36"/>
    <circle cx="360" cy="36" r="4" fill="#c9a96a"/>
  </g>
</svg>
